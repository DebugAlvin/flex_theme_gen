tokens:
  prefix: tw #链式扩展增加前缀
  spacing:
    2: 2
    4: 4
    6: 6
    8: 8
    10: 10
    12: 12
    16: 16
    24: 24
    32: 32
  radius:
    4: 4
    8: 8
    12: 12
    16: 16
    24: 24
  shadow:
    2: 2
    8: 8
    12: 12
    16: 16
    24: 24
  misc:
    blurSm: 2
    blurMd: 6
    opacityDisabled: 0.5
  border:
    default:
      colorToken: "colorFF33A9FF" # ✅ 可选：引用到 AppColors 的 token（支持明暗）
      width: 1 # 默认宽度
