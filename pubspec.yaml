name: flex_theme_gen
description: Generate Flutter theme code from design tokens (YAML/JSON).
version: 1.0.8
repository: https://github.com/DebugAlvin/flex_theme_gen
issue_tracker: https://github.com/DebugAlvin/flex_theme_gen/issues
homepage: https://github.com/DebugAlvin/flex_theme_gen
topics: [flutter, cli, design-tokens, theming]

environment:
  sdk: ">=3.0.0 <4.0.0"

executables:
  gen_flex_theme: flex_theme_gen

# Add regular dependencies here.
dependencies:
  args: ^2.5.0
  yaml: ^3.1.2
  path: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0

assets:
  - lib/src/templates/
